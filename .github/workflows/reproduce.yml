name: Full reproducibility run

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Evaluation from supplied checkpoints or training from scratch
        required: true
        default: checkpoints
        type: choice
        options:
          - checkpoints
          - train

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      RUN_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tested numerical dependencies (CPU)
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Verify inputs and run unit tests
        run: |
          python reproduce.py check
          python reproduce.py test
      - name: Regenerate all experiments
        run: python reproduce.py "$RUN_MODE" --output runs/full
      - name: Independent equation and checkpoint audit
        run: python reproduce.py audit --output runs/audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-reproducibility-report
          path: |
            runs/full/run.log
            runs/full/run_manifest.json
            runs/full/environment.json
            runs/full/comparison.json
            runs/full/results/
            runs/full/tables/
            runs/full/figures/
            runs/audit/run.log
            runs/audit/run_manifest.json
            runs/audit/audit/
          if-no-files-found: warn
          retention-days: 14
