name: Scientific regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tested numerical dependencies (CPU)
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Verify released scientific inputs
        run: python reproduce.py check
      - name: Run unit and equation tests
        run: python reproduce.py test
      - name: Regenerate the static experiment from its checkpoint
        run: python reproduce.py checkpoints --experiment static --output runs/ci-static
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-reproducibility-report
          path: |
            runs/ci-static/run.log
            runs/ci-static/run_manifest.json
            runs/ci-static/comparison.json
            runs/ci-static/environment.json
            runs/ci-static/tables/
          if-no-files-found: warn
          retention-days: 14
